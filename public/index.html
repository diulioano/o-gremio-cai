<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quem vai cair?</title>
<meta name="description" content="Simulador da reta final do Brasileirão: tabela, palpites e a chance de cada time cair.">
<meta property="og:title" content="Quem vai cair?">
<meta property="og:description" content="Tabela, palpites e a chance de cada time cair no Brasileirão.">
<meta name="theme-color" content="#07090D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307090D'/%3E%3Cpath d='M16 6v15m-7-7 7 7 7-7' stroke='%23FF2E3D' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
[data-theme="dark"]{--bg:#07090D;--surface:#10151D;--surface-2:#18202B;--text:#F2F5F8;--text-muted:#8C98A8;--accent:#1A9BE0;--danger:#FF2E3D;--safe:#2EE57A;--warn:#FFB020;--line:#233042;color-scheme:dark}
[data-font="archivo"]{--body:'Archivo',system-ui,sans-serif;--head:'Archivo',sans-serif;--head-w:900;--head-s:100%;--head-ls:-.04em;--ans:min(clamp(4rem,21vw,17rem),34vh);--q:clamp(1.3rem,6vw,5.4rem)}
html,body{margin:0;background:#07090D}
*{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;touch-action:manipulation}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:color-mix(in srgb, var(--accent, #1A9BE0) 40%, transparent);color:#fff}
html{scrollbar-color:#233042 #07090D;caret-color:var(--accent, #1A9BE0)}
[data-theme] *{scrollbar-color:var(--line) transparent}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ico{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.125em}
.card{transition:transform .25s cubic-bezier(.16,1,.3,1),filter .25s cubic-bezier(.16,1,.3,1)}
.card:focus-visible{outline-offset:3px}
@media (hover:hover){.card:hover{transform:translateY(-2px);filter:brightness(1.2);text-decoration:none}}
.card:active{transform:scale(.985);filter:brightness(1.1)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
@keyframes stamp{0%{transform:scale(1.18) translateY(5%);opacity:0;filter:blur(8px)}35%{opacity:1}100%{transform:none;opacity:1;filter:none}}
@keyframes glowpulse{50%{filter:brightness(1.35) saturate(1.15)}}
@keyframes livedot{50%{opacity:.2}}
@keyframes shimmer{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="/app.js"></script>
</body>
</html>
